{% extends "header.html" %}

{% block title %}Editar Ofertas de Trabajo{% endblock %}

{% block content %}

<h1>Gestión de Ofertas de Trabajo</h1>

<h2>Editar Oferta</h2>
<form method="post" action="{% url 'editar_oferta' oferta.id %}">
    {% csrf_token %}
    <label for="cargo_vacante">Cargo vacante:</label>
    <input type="text" id="cargo_vacante" name="cargo_vacante" required><br><br>

    <label for="descripcion_del_cargo">Descripción del cargo:</label>
    <input type="text" id="descripcion_del_cargo" name="descripcion_del_cargo" required><br><br>

    <label for="salario">Salario:</label>
    <input type="number" id="salario" name="salario" required><br><br>

    <label for="area_de_conocimiento">Área de conocimiento:</label>
    <select id="area_de_conocimiento" name="area_de_conocimiento" required>
        {% for area in areas %}
        <option value="{{ area.id }}">{{ area.nombre }}</option>
        {% endfor %}
    </select><br><br>

    <input type="submit" value="Guardar Cambios">
</form>

{% endblock %}
