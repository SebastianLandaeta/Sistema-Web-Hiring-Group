{% extends "header.html" %}

{% block title %}Registro de postulantes{% endblock %}

{% block content %}

<h3>Formulario de Registro (U. Postulante)</h3>
<form method="POST">
  {% csrf_token %}

  <label for="cedula">Cédula:</label>
  <input type="number" name="cedula" required>
  <br>

  <label for="nombre">Nombre:</label>
  <input type="text" name="nombre" required>
  <br>

  <label for="apellido">Apellido:</label>
  <input type="text" name="apellido" required>
  <br>

  <label for="correo">Correo:</label>
  <input type="email" name="correo" required>
  <br>

  <label for="contrasena">Contraseña:</label>
  <input type="password" name="contrasena" required>
  <br>

  <label for="sexo">Sexo:</label>
  <select name="sexo" required>
    <option value="M">Masculino</option>
    <option value="F">Femenino</option>
  </select>
  <br>

  <label for="telefono">Telefono:</label>
  <input type="number" name="telefono" required>
  <br>

  <label for="tipo_sangre">Tipo de sangre:</label>
  <select name="tipo_sangre" required>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
  </select>
  <br>

  <label for="contacto">Persona de contacto:</label>
  <input type="number" name="contacto" required>
  <br>

  <label for="numero_emergencia">Número de emergencia:</label>
  <input type="number" name="numero_emergencia" required>

  <button type="submit">Guardar</button>
  <br>
</form>

{% if error_message %}
<p class="text-danger">{{ error_message }}</p>
{% endif %}

{% endblock %}
